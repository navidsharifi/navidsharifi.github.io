---
layout: default
---

<header class="container page-header">
  {%- if page.eyebrow %}<p class="eyebrow"><span class="dot" aria-hidden="true"></span>{{ page.eyebrow }}</p>{%- endif %}
  <h1>{{ page.title }}</h1>
  {%- if page.description %}<p>{{ page.description }}</p>{%- endif %}
</header>

<div class="container container--narrow listing">
  <div class="article-post">
    {{ content }}
  </div>
</div>
