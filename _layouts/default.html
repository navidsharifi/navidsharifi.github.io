<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}" class="dark">
{%- include site/head.html -%}
<body>
  {%- include site/icons.html -%}
  {%- include site/navbar.html -%}

  <main class="page-content" id="main" aria-label="Content">
    {%- if jekyll.environment == 'production' and site.gtm -%}
    {%- include analytics/gtm-body.html -%}
    {%- endif -%}
    {{ content }}
  </main>

  {%- include site/footer.html -%}
  <script src="{{ '/assets/js/lazy-media.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
