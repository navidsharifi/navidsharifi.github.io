<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}" class="dark">
{%- include head.html -%}
<body>
  {%- include icons.html -%}
  {%- include menubar.html -%}

  <main class="page-content" id="main" aria-label="Content">
    {%- if jekyll.environment == 'production' and site.gtm -%}
    {%- include gtm_body.html -%}
    {%- endif -%}
    {{ content }}
  </main>

  {%- include footer.html -%}
  <script src="{{ '/assets/js/lazy-media.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/index.js' | relative_url }}" defer></script>
</body>
</html>
