<!--
  CENTRALIZED COLOUR PALETTE
  ==========================
  Generated from _config.yml → palette. Edit there to change colours site-wide.

  ACCENT (palette.accent):
    yellow (default) · vivid-red · crimson · coral · rose · ruby · purple · emerald · sky

  DARK BACKGROUND (palette.dark_bg):
    pure-black (default) · near-black · charcoal

  LIGHT BACKGROUND (palette.light_bg):
    white (default) · snow · cream · cool-gray
-->
<style id="palette-variables">
:root {
  {%- case site.palette.accent %}
  {%- when "vivid-red" %}
  --accent-color: #dc2626; --accent-hover: #b91c1c; --accent-rgb: 220, 38, 38;
  {%- when "crimson" %}
  --accent-color: #b91c1c; --accent-hover: #991b1b; --accent-rgb: 185, 28, 28;
  {%- when "coral" %}
  --accent-color: #ea580c; --accent-hover: #c2410c; --accent-rgb: 234, 88, 12;
  {%- when "rose" %}
  --accent-color: #e11d48; --accent-hover: #be123c; --accent-rgb: 225, 29, 72;
  {%- when "ruby" %}
  --accent-color: #be123c; --accent-hover: #9f1239; --accent-rgb: 190, 18, 60;
  {%- when "purple" %}
  --accent-color: #7c3aed; --accent-hover: #6d28d9; --accent-rgb: 124, 58, 237;
  {%- when "emerald" %}
  --accent-color: #059669; --accent-hover: #047857; --accent-rgb: 5, 150, 105;
  {%- when "sky" %}
  --accent-color: #0284c7; --accent-hover: #0369a1; --accent-rgb: 2, 132, 199;
  {%- else %}
  --accent-color: #ca8a04; --accent-hover: #a16207; --accent-rgb: 202, 138, 4;
  {%- endcase %}

  {%- case site.palette.light_bg %}
  {%- when "snow" %}
  --bg: #fafafa; --bg-elev: #ffffff;
  {%- when "cream" %}
  --bg: #fffdf7; --bg-elev: #ffffff;
  {%- when "cool-gray" %}
  --bg: #f8fafc; --bg-elev: #ffffff;
  {%- else %}
  --bg: #ffffff; --bg-elev: #fafafa;
  {%- endcase %}
}

html.dark {
  {%- case site.palette.accent %}
  {%- when "vivid-red" %}
  --accent-color: #ef4444; --accent-hover: #f87171; --accent-rgb: 239, 68, 68;
  {%- when "crimson" %}
  --accent-color: #dc2626; --accent-hover: #ef4444; --accent-rgb: 220, 38, 38;
  {%- when "coral" %}
  --accent-color: #f97316; --accent-hover: #fb923c; --accent-rgb: 249, 115, 22;
  {%- when "rose" %}
  --accent-color: #f43f5e; --accent-hover: #fb7185; --accent-rgb: 244, 63, 94;
  {%- when "ruby" %}
  --accent-color: #e11d48; --accent-hover: #f43f5e; --accent-rgb: 225, 29, 72;
  {%- when "purple" %}
  --accent-color: #a78bfa; --accent-hover: #c4b5fd; --accent-rgb: 167, 139, 250;
  {%- when "emerald" %}
  --accent-color: #34d399; --accent-hover: #6ee7b7; --accent-rgb: 52, 211, 153;
  {%- when "sky" %}
  --accent-color: #38bdf8; --accent-hover: #7dd3fc; --accent-rgb: 56, 189, 248;
  {%- else %}
  --accent-color: #eab308; --accent-hover: #facc15; --accent-rgb: 234, 179, 8;
  {%- endcase %}

  {%- case site.palette.dark_bg %}
  {%- when "near-black" %}
  --bg: #0a0a0a; --bg-elev: #111111; --surface: #171717; --surface-2: #1f1f1f;
  {%- when "charcoal" %}
  --bg: #121212; --bg-elev: #181818; --surface: #1e1e1e; --surface-2: #262626;
  {%- else %}
  --bg: #000000; --bg-elev: #0a0a0a; --surface: #101010; --surface-2: #181818;
  {%- endcase %}
}
</style>
