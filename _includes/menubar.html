<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header" id="site-header">
  <div class="container nav-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.name }} — home">
      <span class="brand-mark" aria-hidden="true">N</span>
      <span>{{ site.name }}</span>
    </a>

    <nav aria-label="Primary">
      <ul class="nav-links" id="nav-links">
        {%- for item in site.data.menu_items.menu.docs %}
        <li><a href="{{ item.url | relative_url }}" class="nav-link">{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>

    <div class="nav-actions">
      <button type="button" class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle colour theme" title="Toggle theme">
        <svg class="icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
        <svg class="icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
      </button>
      <button type="button" class="icon-btn nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
        <svg class="icon-menu" aria-hidden="true"><use href="#i-menu"/></svg>
      </button>
    </div>
  </div>
</header>
