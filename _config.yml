# About Section
# about_title: About Me (Use this to override about section title)
about_profile_image: assets/images/profile/profile.png # Path to the profile image
about_content: | # this will include new lines to allow paragraphs
  With a background in **industrial engineering**, I bring hands-on experience in **EPC project management for large-scale industrial systems**, **business and system analysis in fleet management projects**, and **IT project management using agile methodology** — alongside a growing focus on how data-driven and analytical methods can improve business operations and support better decision-making.

  I combine practical project management experience with rigorous analytical and modelling techniques to bridge theory and real-world operational challenges.

# Research Section (shown below About on the home page)
research_title: Research
research_subtitle: Decision-making under distributional uncertainty
research_content: |
  I work on robust decision-making under distributional uncertainty, where the interesting part is not the nominal model but the ambiguity around it. I use **distributionally robust optimization (DRO)** with &phi;-divergence and Wasserstein ambiguity sets, **optimal transport** and Sinkhorn divergences as the geometric backbone, **convex duality** for tractable worst-case reformulations, and **minimax / saddle-point methods** to solve the resulting robust-adversarial games at scale.

  ### Current focus
  A unified, GPU-native treatment of Wasserstein-based DRO as a differentiable optimization layer &mdash; connecting convex duality, saddle-point solvers, and optimal transport geometry into a single scalable framework for decision-making that stays reliable when the data-generating distribution shifts.

